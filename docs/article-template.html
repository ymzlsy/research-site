<script>
// Theme toggle
function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.querySelector('.theme-toggle').textContent = next === 'dark' ? '☀️' : '🌙';
}
const savedTheme = localStorage.getItem('theme');
if (savedTheme) {
  document.documentElement.setAttribute('data-theme', savedTheme);
  if (savedTheme === 'dark') document.querySelector('.theme-toggle').textContent = '☀️';
}

// Reading progress
window.addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  document.getElementById('readingProgress').style.width = (window.scrollY / h * 100) + '%';

  // Back to top
  document.getElementById('backToTop').classList.toggle('visible', window.scrollY > 400);

  // Active sidebar link
  const sections = document.querySelectorAll('h2[id], h3[id]');
  let current = '';
  sections.forEach(s => { if (s.getBoundingClientRect().top < 120) current = s.id; });
  document.querySelectorAll('.sidebar-link').forEach(a => {
    a.classList.toggle('active', a.getAttribute('href') === '#' + current);
  });
});
</script>
